name: Deploy Holy Fire site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: holyfire-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::290812637674:role/github-actions-holyfire-deploy
          role-session-name: github-actions-holyfire-deploy
          aws-region: us-east-1

      - name: Upload site to S3
        run: aws s3 sync out/ s3://holyfiremusical-site/ --delete --cache-control "public, max-age=300"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3HE5MX1Q142W9 --paths "/*"
