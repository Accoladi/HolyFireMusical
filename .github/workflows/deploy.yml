name: Deploy Holy Fire site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: holyfire-site-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        run: npm run build

      - name: Show GitHub OIDC identity
        shell: bash
        run: |
          oidc_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          oidc_token="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).value)' "${oidc_response}")"
          OIDC_TOKEN="${oidc_token}" node -e 'const claims = JSON.parse(Buffer.from(process.env.OIDC_TOKEN.split(".")[1], "base64url").toString()); console.log(JSON.stringify({ iss: claims.iss, aud: claims.aud, sub: claims.sub, repository: claims.repository, repository_id: claims.repository_id, ref: claims.ref, job_workflow_ref: claims.job_workflow_ref }, null, 2));'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::290812637674:role/github-actions-holyfire-deploy
          role-session-name: github-actions-holyfire-deploy
          aws-region: us-east-1
          allowed-account-ids: 290812637674
          retry-max-attempts: 3

      - name: Upload site to S3
        run: aws s3 sync out/ s3://holyfiremusical-site/ --delete --cache-control "public, max-age=300"

      - name: Refresh CloudFront
        run: aws cloudfront create-invalidation --distribution-id E3HE5MX1Q142W9 --paths "/*"
